seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
epochs: 60
batch_size: 8
grad_accum: 2
world_size: 1
validation_fraction: 0.22
early_stopping_patience: 12

optimizer:
  name: adamw
  learning_rate: 0.0003
  encoder_learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_clip: 1.0

schedule:
  name: cosine
  warmup_steps: 50
  total_steps: 1400
  minimum_ratio: 0.02

precision:
  name: bf16

ema_decay: 0.999
train_encoder: false
regulariser_scale: 0.0
